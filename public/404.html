<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Living Garden</title>
    <script>
      // Single Page App redirect for GitHub Pages
      const pathSegments = window.location.pathname.slice(1).split('/');
      const repo = pathSegments[0];
      const route = pathSegments.slice(1).join('/');
      const search = window.location.search || '';
      const hash = window.location.hash || '';
      window.location.replace('/' + repo + '/#/' + route + search + hash);
    </script>
  </head>
  <body>
    Redirecting to The Living Garden...
  </body>
</html>
